<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultFX — Pilotage financier</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --txt:#eef1f8; --txt2:#c4cad9; --muted:#98a0b5; --muted2:#828aa2; --dim2:#6e768c; --dim:#5c6379; --dim3:#3f4457;
    --acc-tx:#a9b4ff; --bg-base:#0f1320;
    --app-bg: radial-gradient(1100px 640px at 12% -14%, rgba(99,102,241,0.16), transparent 60%),radial-gradient(1000px 540px at 106% -4%, rgba(139,92,246,0.11), transparent 55%),radial-gradient(900px 720px at 50% 120%, rgba(56,70,160,0.10), transparent 60%),#0f1320;
    --card-bg: rgba(26,31,46,0.74); --card-bd: rgba(132,142,182,0.15); --card-sh: 0 16px 42px -28px rgba(10,14,34,0.85), inset 0 1px 0 rgba(255,255,255,0.04);
    --head-bg: rgba(15,19,32,0.82); --th-bg:#1a2033; --sticky-bg:#161b2b; --wtot-first:#1c2338;
    --fill0: rgba(255,255,255,0.02); --fill1: rgba(255,255,255,0.03); --fill2: rgba(255,255,255,0.045); --fill3: rgba(255,255,255,0.06);
    --line0: rgba(255,255,255,0.05); --line1: rgba(255,255,255,0.06); --line: rgba(255,255,255,0.08); --line2: rgba(255,255,255,0.10); --line3: rgba(255,255,255,0.12);
    --inp-bg: rgba(255,255,255,0.05); --inp-bd: rgba(132,142,182,0.24);
    --tick:#828aa2; --legend:#c4cad9; --grid: rgba(255,255,255,0.06); --tip-bg: rgba(22,27,42,0.97);
    --scroll: rgba(132,142,182,0.35); --scrolltrack: rgba(255,255,255,0.03);
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --txt:#1f2433; --txt2:#4a5163; --muted:#6b7285; --muted2:#7c8497; --dim2:#8f96a8; --dim:#a6adbd; --dim3:#cdd2dd;
    --acc-tx:#5b4bd6; --bg-base:#f4f6fb;
    --app-bg: radial-gradient(1100px 640px at 12% -14%, rgba(99,102,241,0.07), transparent 60%),radial-gradient(1000px 540px at 106% -4%, rgba(139,92,246,0.05), transparent 55%),radial-gradient(900px 720px at 50% 120%, rgba(56,70,160,0.04), transparent 60%),#f4f6fb;
    --card-bg: #ffffff; --card-bd: rgba(70,80,120,0.14); --card-sh: 0 10px 26px -18px rgba(40,50,90,0.18), inset 0 1px 0 #ffffff;
    --head-bg: rgba(250,251,255,0.85); --th-bg:#eef1f8; --sticky-bg:#f3f5fb; --wtot-first:#eaeefb;
    --fill0: rgba(50,60,100,0.02); --fill1: rgba(50,60,100,0.03); --fill2: rgba(50,60,100,0.045); --fill3: rgba(50,60,100,0.06);
    --line0: rgba(40,50,80,0.07); --line1: rgba(40,50,80,0.08); --line: rgba(40,50,80,0.10); --line2: rgba(40,50,80,0.12); --line3: rgba(40,50,80,0.14);
    --inp-bg: rgba(60,70,110,0.05); --inp-bd: rgba(60,70,110,0.20);
    --tick:#8f96a8; --legend:#4a5163; --grid: rgba(40,50,80,0.09); --tip-bg: rgba(35,40,60,0.96);
    --scroll: rgba(99,102,241,0.35); --scrolltrack: rgba(60,70,110,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg-base); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 20px; }
  ::-webkit-scrollbar-track { background: var(--scrolltrack); }
  @keyframes floatGlow { 0%,100% { opacity: .5; } 50% { opacity: .9; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  a { color: #b794ff; text-decoration: none; } a:hover { color: var(--acc-tx); }
  body, input, button, select, textarea { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
  .vf-mono { font-family: 'Montserrat', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; letter-spacing: -0.01em; }
  .vf-card { padding: 20px 22px; border-radius: 20px; background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-bd); box-shadow: var(--card-sh); }
  .vf-view { animation: fadeIn .25s ease; }
  .vf-navbtn:hover { background: rgba(167,139,250,0.12) !important; }
  input.vf-inp { width: 100%; padding: 9px 11px; border-radius: 10px; background: var(--inp-bg); border: 1px solid var(--inp-bd); color: var(--txt); font-size: 13px; font-family: 'Montserrat', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  input.vf-inp:focus { outline: none; border-color: #b794ff; }
  .vf-th { font-size: 10.5px; font-weight: 700; color: var(--dim2); letter-spacing: 0.02em; text-transform: uppercase; }
  /* ledger table */
  table.led { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.led th { position: sticky; top: 0; background: var(--th-bg); z-index: 2; padding: 9px 6px; text-align: right; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; border-bottom: 1px solid rgba(167,139,250,0.2); white-space: nowrap; }
  table.led th:first-child, table.led td:first-child { text-align: left; position: sticky; left: 0; background: var(--sticky-bg); z-index: 1; }
  table.led th:first-child { z-index: 3; }
  table.led td { padding: 3px 5px; text-align: right; border-bottom: 1px solid var(--line0); white-space: nowrap; }
  table.led input { width: 78px; padding: 6px 7px; border-radius: 7px; background: rgba(183,148,255,0.10); border: 1px solid rgba(167,139,250,0.2); color: var(--txt); font-size: 12px; text-align: right; font-family: 'Montserrat', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  table.led input:focus { outline: none; border-color: #b794ff; background: rgba(183,148,255,0.18); }
  table.led .comp { color: var(--txt2); font-family: 'Montserrat', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; }
  tr.wtot td { background: rgba(167,139,250,0.12); font-weight: 700; color: var(--txt); border-top: 1px solid rgba(167,139,250,0.2); border-bottom: 1px solid rgba(167,139,250,0.2); }
  tr.mtot td { background: linear-gradient(90deg, rgba(124,58,237,0.28), rgba(124,58,237,0.12)); font-weight: 800; color: var(--txt); border-top: 2px solid #7c3aed; }
  tr.wend td:first-child, tr.wtot td:first-child, tr.mtot td:first-child { background: var(--wtot-first); }
  .wend { border-bottom: 1px solid rgba(167,139,250,0.15) !important; }
</style>
</head>
<body>
<div id="app" style="min-height:100vh;width:100%;font-family:'Montserrat',system-ui,-apple-system,sans-serif;color:var(--txt);background:var(--app-bg);display:grid;grid-template-columns:238px 1fr;letter-spacing:-0.01em;">
  <aside style="border-right:1px solid rgba(167,139,250,0.14);padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;">
    <div style="display:flex;align-items:center;gap:11px;padding:4px 8px;">
      <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#b794ff,#7c3aed);box-shadow:0 6px 22px -6px #7c3aed;display:grid;place-items:center;font-weight:800;font-size:17px;color:#0a0710;">V</div>
      <div><div style="font-weight:800;font-size:16px;line-height:1;">Vault<span style="color:#b794ff;">FX</span></div><div style="font-size:10.5px;color:var(--muted2);font-weight:600;letter-spacing:0.04em;margin-top:3px;">PILOTAGE FINANCIER</div></div>
    </div>
    <nav id="nav" style="display:flex;flex-direction:column;gap:2px;"></nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:0.08em;padding:0 8px;">SOURCE</div>
      <div id="sources" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>
  </aside>
  <main style="min-width:0;display:flex;flex-direction:column;">
    <header style="display:flex;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid var(--card-bd);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--head-bg);">
      <div><div id="viewTitle" style="font-size:19px;font-weight:800;">Saisie journalière</div><div id="viewSub" style="font-size:12px;color:var(--muted2);font-weight:500;margin-top:2px;">—</div></div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <div style="display:flex;align-items:center;gap:4px;padding:4px;border-radius:11px;background:var(--fill3);border:1px solid rgba(167,139,250,0.12);">
          <button id="mPrev" style="border:none;background:transparent;color:var(--txt2);cursor:pointer;font-size:15px;padding:4px 9px;border-radius:8px;">‹</button>
          <span id="mLabel" class="vf-mono" style="font-size:13px;font-weight:700;min-width:118px;text-align:center;">—</span>
          <button id="mNext" style="border:none;background:transparent;color:var(--txt2);cursor:pointer;font-size:15px;padding:4px 9px;border-radius:8px;">›</button>
        </div>
        <button id="importBtn" style="display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;background:rgba(167,139,250,0.14);border:1px solid rgba(167,139,250,0.25);font-size:12.5px;font-weight:600;color:var(--acc-tx);cursor:pointer;">⬇ Importer CA Shopify</button>
        <div id="themeSel" style="display:flex;padding:3px;border-radius:11px;background:var(--fill3);border:1px solid rgba(167,139,250,0.14);"></div>
        <span id="saveDot" style="width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 7px #34d399;" title="Sauvegardé"></span>
      </div>
    </header>
    <div id="content" style="padding:20px 26px 46px;display:flex;flex-direction:column;gap:18px;min-height:60vh;"></div>
  </main>
</div>

<script>
"use strict";
const SHOP="mcp__75d0e088-f5e9-4a7b-bdf8-b52dc05e1f06";
const green='#34d399', red='#fb7185', amber='#fbbf24', teal='#5eead4', accent='#b794ff', accent2='#7c3aed';
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const WD=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

// ---------- persistence ----------
const DEF_SET={tva:20, fraisPct:3.5, impotPct:15, roasBE:1.65};
const DEF_FIXED=[{name:'Remboursements',amount:0},{name:'App Shopify',amount:0},{name:'Abonnements / logiciels',amount:0}];
const DEF_OBJ=[10000,13500,15000,23000,25000,30000,30000,30000,30000,45000,60000,50000];
const DEMO_VARIANTS=[
  {p:'Cils magnétiques réutilisables',v:'Mixte - N°1 des ventes',net:13192.78,gross:17153.9,ord:432},
  {p:'Cils magnétiques réutilisables',v:'(sans variante)',net:5479.6,gross:6141.85,ord:118},
  {p:'Cils magnétiques réutilisables',v:'Volumineux',net:2948.82,gross:4910.4,ord:124},
  {p:'Cils magnétiques réutilisables',v:'Naturel',net:2609.24,gross:4004.9,ord:110},
  {p:'Cils magnétiques réutilisables',v:'Cils Mystère – Nouveauté',net:372.84,gross:537.3,ord:17},
  {p:'LashesGLAM Sérum de croissance',v:'—',net:533.94,gross:747,ord:22},
  {p:'GLAMLASH Mascara booster',v:'—',net:470.08,gross:720.06,ord:22},
  {p:'Nettoyant Faux Cils',v:'—',net:222.45,gross:298.5,ord:15},
  {p:'FreshGlam Patchs yeux',v:'—',net:163.88,gross:214,ord:7},
  {p:'LashGLAM Kit 5 en 1',v:'Mixte',net:74.24,gross:174.75,ord:3}
];
function load(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} flashSaved(); schedulePush(); }
function flashSaved(){ const d=document.getElementById('saveDot'); if(!d)return; d.style.background=amber; setTimeout(()=>d.style.background=green,300); }

// ---------- Thème (clair / sombre / système) ----------
function cssv(n){ try{ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }catch(e){ return ''; } }
const THX={ get tick(){return cssv('--tick')||'var(--dim)';}, get txt2(){return cssv('--legend')||'var(--txt2)';}, get grid(){return cssv('--grid')||'rgba(255,255,255,0.05)';}, get tip(){return cssv('--tip-bg')||THX.tip;} };
function getTheme(){ return load('vfx3_theme','system'); }
function applyTheme(){ const t=getTheme(); const eff=t==='system'?((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):t; if(eff==='light')document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme'); }
function setTheme(t){ save('vfx3_theme',t); applyTheme(); renderChrome(); renderView(); }
if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(getTheme()==='system'){ applyTheme(); if(typeof renderChrome==='function'){renderChrome();renderView();} } }); }catch(e){} }

// ---------- Sauvegarde / synchro cloud (Google Sheets) ----------
const SPREFIX='vfx3_';
function gatherState(){ const o={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.indexOf(SPREFIX)===0&&k!=='vfx3_lastsync'){ try{o[k]=JSON.parse(localStorage.getItem(k));}catch(e){o[k]=localStorage.getItem(k);} }} return o; }
function applyState(o){ if(!o||typeof o!=='object')return; Object.keys(o).forEach(k=>{ if(k.indexOf(SPREFIX)===0){ try{localStorage.setItem(k,JSON.stringify(o[k]));}catch(e){} } }); }
function reloadStateFromStorage(){ STATE.month=load('vfx3_month',curMonth()); STATE.settings=Object.assign({},DEF_SET,load('vfx3_settings',{})); STATE.fixedByMonth=load('vfx3_fixedm',{}); STATE.fraisByMonth=load('vfx3_fraism',{}); STATE.objectifs=load('vfx3_objectifs',DEF_OBJ); STATE.ledger=load('vfx3_ledger',{}); STATE.calc=load('vfx3_calc',null); STATE.ads=load('vfx3_ads',{}); }
function getSyncUrl(){ return load('vfx3_syncurl',''); }
function getSyncKey(){ return load('vfx3_synckey',''); }
function autoSync(){ return load('vfx3_autosync',false); }
let _pushT=null, _syncing=false;
function schedulePush(){ if(_syncing||!getSyncUrl()||!autoSync())return; clearTimeout(_pushT); _pushT=setTimeout(()=>{ syncPush(true).catch(()=>{}); },2500); }
async function cloudPost(action,data){ const url=getSyncUrl(); if(!url)throw new Error('URL non configurée'); const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,key:getSyncKey(),data})}); let j; try{ j=await res.json(); }catch(e){ throw new Error('Réponse invalide — vérifie le déploiement du script'); } if(!j.ok)throw new Error(j.error||'Erreur'); return j; }
async function syncPush(silent){ if(!getSyncUrl()){ if(!silent)cloudMsg("Configure d'abord l'URL",red); return; } _syncing=true; try{ await cloudPost('save',gatherState()); try{localStorage.setItem('vfx3_lastsync',new Date().toISOString());}catch(e){} if(!silent)cloudMsg('Sauvegardé dans le cloud ✓',green); }catch(e){ if(!silent)cloudMsg('Échec : '+e.message,red); throw e; } finally{ _syncing=false; updateSyncStatus(); } }
async function syncPull(){ try{ const j=await cloudPost('load',null); if(!j.data||!Object.keys(j.data).length){ cloudMsg("Aucune donnée dans le cloud pour l'instant.",amber); return; } applyState(j.data); reloadStateFromStorage(); try{localStorage.setItem('vfx3_lastsync',new Date().toISOString());}catch(e){} cloudMsg('Données chargées depuis le cloud ✓',green); renderChrome(); renderView(); }catch(e){ cloudMsg('Échec : '+e.message,red); } }
function exportJSON(){ const blob=new Blob([JSON.stringify(gatherState(),null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='vaultfx-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); cloudMsg('Sauvegarde téléchargée ✓',green); }
function importJSON(file){ const r=new FileReader(); r.onload=()=>{ try{ applyState(JSON.parse(r.result)); reloadStateFromStorage(); cloudMsg('Import réussi ✓',green); renderChrome(); renderView(); }catch(e){ cloudMsg('Fichier invalide',red); } }; r.readAsText(file); }
function cloudMsg(t,c){ const el=document.getElementById('cloud_msg'); if(el){ el.textContent=t; el.style.color=c||'var(--muted2)'; } }
function updateSyncStatus(){ const el=document.getElementById('cloud_status'); if(!el)return; const t=load('vfx3_lastsync',null); el.textContent=t?('Dernière synchro : '+new Date(t).toLocaleString('fr-FR')):'Jamais synchronisé sur cet appareil'; }
// Envoi de secours à la fermeture/onglet caché (évite la perte du dernier changement)
function flushBeacon(){ try{ if(!getSyncUrl()||!autoSync())return; const payload=JSON.stringify({action:'save',key:getSyncKey(),data:gatherState()}); if(navigator.sendBeacon){ navigator.sendBeacon(getSyncUrl(), new Blob([payload],{type:'text/plain;charset=UTF-8'})); localStorage.setItem('vfx3_lastsync',new Date().toISOString()); } }catch(e){} }
window.addEventListener('pagehide', flushBeacon);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushBeacon(); });

function curMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
const STATE={
  nav:'journal',
  month: load('vfx3_month', curMonth()),
  settings: Object.assign({},DEF_SET, load('vfx3_settings',{})),
  fixedByMonth: load('vfx3_fixedm', {}),
  fraisByMonth: load('vfx3_fraism', {}),
  objectifs: load('vfx3_objectifs', DEF_OBJ),
  ledger: load('vfx3_ledger', {}),
  weeks: [],
  productsData: null, productsErr: null,
  calc: load('vfx3_calc', null),
  ads: load('vfx3_ads', {})
};
const DEF_CALC={prix:34.85,cout:5.29,livraison:0,autres:0,fraisPct:3.5,tva:20,cpa:12,ventes:100,fixe:null};
function getCalc(){ const c=Object.assign({},DEF_CALC,STATE.calc||{}); if(c.fixe==null)c.fixe=fixedTotal(STATE.month); return c; }

// ---------- format ----------
function num(x){ const n=parseFloat(x); return isNaN(n)?0:n; }
function eur(n){ return eur2(n); }
function eur2(n){ const v=Number(n)||0; return (v<0?'−€':'€')+new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(v)); }
function pctv(x){ return (x*100).toFixed(1).replace('.',',')+'%'; }
function setTxt(id,t){ const el=document.getElementById(id); if(el)el.textContent=t; }
function setCol(id,c){ const el=document.getElementById(id); if(el)el.style.color=c; }

// ---------- Shopify (optionnel, pour import) ----------
const HAS_COWORK=(typeof window!=='undefined')&&window.cowork&&typeof window.cowork.callMcpTool==='function';
function getProxy(){ return load('vfx3_proxy',''); }
function connMode(){ if(HAS_COWORK)return 'cowork'; if(getProxy())return 'proxy'; return 'off'; }
async function mcp(tool,args){
  if(HAS_COWORK){ const r=await window.cowork.callMcpTool(SHOP+'__'+tool,args||{}); if(r&&r.isError)throw new Error('MCP'); let raw=r&&r.structuredContent; if(!raw&&r&&r.content&&r.content[0]&&r.content[0].text)raw=JSON.parse(r.content[0].text); return raw; }
  const p=getProxy(); if(p){ const res=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool,args:args||{}})}); if(!res.ok)throw new Error('Proxy '+res.status); return await res.json(); }
  throw new Error('Shopify non connecté');
}

// ---------- compute ----------
function computeDay(e){
  const s=STATE.settings, ca=num(e.ca), tva=s.tva/100;
  const caHT=ca/(1+tva), cout=num(e.cout), frais=ca*(s.fraisPct/100), cmd=num(e.cmd), ads=num(e.ads);
  const cpa=cmd?ads/cmd:0, cpar=(cmd&&caHT)?cpa/caHT:0, panier=cmd?ca/cmd:0;
  const marge=caHT-cout-frais-ads, txm=caHT?marge/caHT:0, roas=ads?ca/ads:0;
  return {ca,caHT,cout,frais,cmd,ads,cpa,cpar,panier,marge,txm,roas};
}
function buildWeeks(){
  const [y,m]=STATE.month.split('-').map(Number); const dim=new Date(y,m,0).getDate();
  const weeks=[]; let cur=[];
  for(let d=1;d<=dim;d++){
    const dateKey=STATE.month+'-'+String(d).padStart(2,'0'); const wd=new Date(y,m-1,d).getDay();
    cur.push({d,dateKey,wd});
    if(wd===0||d===dim){ weeks.push(cur); cur=[]; }
  }
  STATE.weeks=weeks;
}
function fraisOverride(m){ const v=STATE.fraisByMonth[m]; return (v!=null&&v!=='')?num(v):null; }
function monthAgg(month){
  const [y,m]=month.split('-').map(Number); const dim=new Date(y,m,0).getDate();
  const A={ca:0,caHT:0,cout:0,frais:0,cmd:0,ads:0,marge:0};
  for(let d=1;d<=dim;d++){ const e=STATE.ledger[month+'-'+String(d).padStart(2,'0')]; if(!e)continue; const r=computeDay(e); A.ca+=r.ca;A.caHT+=r.caHT;A.cout+=r.cout;A.frais+=r.frais;A.cmd+=r.cmd;A.ads+=r.ads; }
  const fo=fraisOverride(month); if(fo!=null) A.frais=fo;               // frais réels (payout Shopify)
  A.marge=A.caHT-A.cout-A.frais-A.ads;                                   // marge recalculée à partir des totaux
  return A;
}

    });
    setTxt('w_'+wi+'_ca',eur(W.ca));setTxt('w_'+wi+'_caHT',eur(W.caHT));setTxt('w_'+wi+'_cout',eur(W.cout));setTxt('w_'+wi+'_frais',eur(W.frais));

async function importShopify(){
  const btn=document.getElementById('importBtn'); if(connMode()==='off'){ go('connexion'); return; }

  try{
    const [y,m]=STATE.month.split('-').map(Number); const dim=new Date(y,m,0).getDate();
    const start=STATE.month+'-01', end=STATE.month+'-'+String(dim).padStart(2,'0');
    const res=await mcp('run-analytics-query',{query:`FROM sales SHOW total_sales, orders TIMESERIES day SINCE ${start} UNTIL ${end}`});
    const rows=(res&&res.rows)||[];
    rows.forEach(r=>{ const day=String(r[0]).slice(0,10); const ca=num(r[1]), cmd=num(r[2]); if(ca>0||cmd>0){ if(!STATE.ledger[day])STATE.ledger[day]={}; STATE.ledger[day].ca=Math.round(ca*100)/100; STATE.ledger[day].cmd=cmd; } });
    save('vfx3_ledger',STATE.ledger); renderView();
    btn.innerHTML='✓ Importé'; setTimeout(()=>{btn.innerHTML=old;btn.disabled=false;},1500);
  }catch(e){ btn.innerHTML='✕ Échec'; setTimeout(()=>{btn.innerHTML=old;btn.disabled=false;},1800); }
}

}

// ---------- annual aggregation ----------
function annualData(){
  const y=parseInt(STATE.month.split('-')[0]); const rows=[];
  const T={ca:0,caHT:0,cout:0,frais:0,cmd:0,ads:0,marge:0,benef:0,obj:0,impot:0,fixed:0};
  for(let m=0;m<12;m++){
    const key=y+'-'+String(m+1).padStart(2,'0'); const A=monthAgg(key);
    const active=A.ca>0; const impot=A.caHT*(STATE.settings.impotPct/100); const fixed=active?fixedTotal(key):0;
    const benef=A.marge-fixed-impot; const obj=num(STATE.objectifs[m]);
    const r={m,ca:A.ca,caHT:A.caHT,cout:A.cout,frais:A.frais,cmd:A.cmd,ads:A.ads,marge:A.marge,impot,fixed,benef,obj,att:obj?A.ca/obj:0,roas:A.ads?A.ca/A.ads:0,txm:A.caHT?A.marge/A.caHT:0};
    rows.push(r); T.ca+=r.ca;T.caHT+=r.caHT;T.cout+=r.cout;T.frais+=r.frais;T.cmd+=r.cmd;T.ads+=r.ads;T.marge+=r.marge;T.benef+=r.benef;T.obj+=r.obj;T.impot+=impot;T.fixed+=fixed;
  }
  return {y,rows,T};
}

// ---------- ROAS break-even simulator ----------
function observedCogsRate(){ const {T}=annualData(); return T.ca>0?(T.cout/T.ca):0.30; }
function simCogsRate(){ const s=STATE.settings; return (s.simCogsPct!=null?s.simCogsPct/100:observedCogsRate()); }
function simRoas(t, coutRate){ const tva=STATE.settings.tva/100, fraisFrac=STATE.settings.fraisPct/100; const caHT_f=1/(1+tva); const ads_f=caHT_f*(1-t)-coutRate-fraisFrac; return ads_f>0?1/ads_f:null; }
function simulatorCard(){
  const rate=simCogsRate(); const cur=simCurRoas();
  const rows=[0,10,20,30,40].map(t=>{
    const be=t===0;
    return `<tr style="${be?'background:rgba(251,191,36,0.08);':''}">
      <td style="text-align:left;font-weight:${be?800:600};color:${be?amber:'var(--txt2)'};">${be?'Break-even (0%)':t+'% de marge'}</td>
      <td class="vf-mono" id="sim_r_${t}" style="text-align:right;font-weight:800;font-size:15px;color:${be?amber:accent};"></td>
    </tr>`;
  }).join('');
  return `<div class="vf-card">
    <div style="font-size:15px;font-weight:700;margin-bottom:4px;">Simulateur ROAS cible</div>
    <div style="font-size:11.5px;color:var(--muted2);margin-bottom:12px;">ROAS minimum à tenir pour chaque niveau de marge (sur CA HT).</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <label style="font-size:12px;color:var(--muted);font-weight:600;flex:1;">Coût produit (% du CA)</label>
      <div style="position:relative;width:110px;"><input class="vf-inp" id="sim_cogs" type="number" step="any" value="${(rate*100).toFixed(1)}" style="text-align:right;"><span style="position:absolute;right:10px;top:9px;font-size:12px;color:var(--dim);" class="vf-mono">%</span></div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <tr><th class="vf-th" style="text-align:left;padding-bottom:6px;">Objectif</th><th class="vf-th" style="text-align:right;">ROAS cible</th></tr>
      ${rows}
    </table>
    <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;font-size:12px;">
      <span style="color:var(--muted2);">ROAS réel ${STATE.month.split('-')[0]}</span>
      <span class="vf-mono" style="color:${cur&&cur>=(simRoas(0,rate)||99)?green:amber};font-weight:700;">${cur?cur.toFixed(2).replace('.',',')+'x':'—'}</span>
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--dim);line-height:1.5;">TVA ${STATE.settings.tva}% · frais paiement ${STATE.settings.fraisPct}%. Base : CA HT − coût produit − frais − ads.</div>
  </div>`;
}
function simCurRoas(){ const {T}=annualData(); return T.ads?T.ca/T.ads:0; }
function refreshSim(){
  const inp=document.getElementById('sim_cogs'); if(!inp)return;
  const rate=(parseFloat(inp.value)||0)/100;
  STATE.settings.simCogsPct=(parseFloat(inp.value)||0); save('vfx3_settings',STATE.settings);
  [0,10,20,30,40].forEach(t=>{ const r=simRoas(t/100,rate); const el=document.getElementById('sim_r_'+t); if(el) el.textContent=r?r.toFixed(2).replace('.',',')+'x':'impossible'; });
}
function bindSim(){ const inp=document.getElementById('sim_cogs'); if(inp) inp.addEventListener('input',refreshSim); refreshSim(); }
function drawDash(){
  const {rows}=annualData();

    window._dc=new Chart(c,{data:{labels:MONTHS.map(m=>m.slice(0,3)),datasets:[

async function fetchProducts(){

  try{
    const res=await mcp('run-analytics-query',{query:`FROM sales SHOW net_sales, gross_sales, orders GROUP BY product_title, product_variant_title ORDER BY gross_sales DESC LIMIT 20 SINCE ${STATE.month.split('-')[0]}-01-01 UNTIL today`});

    STATE.productsData=rows.map(r=>({p:r[0]||'(sans titre)',v:r[1]||'—',net:num(r[2]),gross:num(r[3]),ord:num(r[4])})).filter(x=>x.gross>0);

function recalcCalc(){
  const g=id=>parseFloat((document.getElementById('calc_'+id)||{}).value)||0;
  const prix=g('prix'),cout=g('cout'),liv=g('livraison'),autres=g('autres'),fraisP=g('fraisPct')/100,tva=g('tva')/100,cpa=g('cpa'),ventes=g('ventes'),fixe=g('fixe');
  const caHT=prix/(1+tva), fraisE=prix*fraisP;
  const margeBrute=caHT-cout-liv-autres-fraisE;
  const roasBE=margeBrute>0?prix/margeBrute:null;
  const profitCmd=margeBrute-cpa, margeNette=prix?profitCmd/prix:0;
  const pointMort=profitCmd>0?Math.ceil(fixe/profitCmd):null;
  const caProj=prix*ventes, margeProj=margeBrute*ventes, profitNet=profitCmd*ventes-fixe;
  const S=(id,v,col)=>{const el=document.getElementById(id);if(el){el.textContent=v;if(col)el.style.color=col;}};
  S('res_margeBrute',eur2(margeBrute),margeBrute<0?red:green);
  S('res_cpaBE',eur2(margeBrute),amber);
  S('res_roasBE',roasBE?roasBE.toFixed(2).replace('.',',')+'x':'—',accent);
  S('res_profitCmd',eur2(profitCmd),profitCmd<0?red:green);
  S('res_margeNette',pctv(margeNette),profitCmd<0?red:green);
  S('res_pointMort',pointMort!=null?pointMort+' ventes':'—','#f472b6');
  S('res_caProj',eur(caProj),'var(--txt)');
  S('res_margeProj',eur(margeProj),margeProj<0?red:green);
  S('res_profitNet',eur(profitNet),profitNet<0?red:green);
  [0,10,20,30,40].forEach(t=>{ const tf=t/100; const cpaT=margeBrute-tf*prix; const roasT=cpaT>0?prix/cpaT:null;
    S('res_roas_'+t,roasT?roasT.toFixed(2).replace('.',',')+'x':'imposs.'); S('res_cpa_'+t,cpaT>0?eur2(cpaT):'—'); });
  const lbl=document.getElementById('calc_ventesLbl'); if(lbl) lbl.textContent=ventes||0;
  // save
  STATE.calc={prix:g('prix'),cout:g('cout'),livraison:g('livraison'),autres:g('autres'),fraisPct:g('fraisPct'),tva:g('tva'),cpa:g('cpa'),ventes:g('ventes'),fixe:g('fixe')};
  save('vfx3_calc',STATE.calc);
}
function bindCalc(){ ['prix','cout','livraison','autres','fraisPct','tva','cpa','ventes','fixe'].forEach(k=>{const el=document.getElementById('calc_'+k);if(el)el.addEventListener('input',recalcCalc);}); recalcCalc(); }

  const [yy,mm]=STATE.month.split('-').map(Number);
  const inp=(k,l,ph)=>`<div style="display:flex;flex-direction:column;gap:5px;"><label style="font-size:11.5px;font-weight:600;color:var(--muted);">${l}</label><input class="vf-inp" id="acq_${k}" type="number" step="any" value="${a[k]!=null?a[k]:''}" placeholder="${ph}"></div>`;
  const kp=(id,l,sub)=>`<div style="padding:13px 15px;border-radius:13px;background:var(--fill2);border:1px solid rgba(167,139,250,0.12);"><div style="font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;">${l}</div><div class="vf-mono" id="${id}" style="font-size:19px;font-weight:800;color:var(--txt);margin-top:3px;">—</div>${sub?`<div style="font-size:10px;color:var(--dim);margin-top:2px;">${sub}</div>`:''}</div>`;
  return `<div class="vf-view">
    <div class="vf-card" style="max-width:640px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px;">Saisie ads — ${MONTHS[mm-1]} ${yy}</div>
      <div style="font-size:11.5px;color:var(--muted2);margin-bottom:14px;">Dépense pub et commandes viennent de ta saisie journalière. Ajoute impressions et clics (depuis ton gestionnaire Meta/TikTok) pour le funnel complet.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${inp('imp','Impressions','0')}${inp('clics','Clics','0')}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
      ${kp('m_dep','Dépense pub','saisie journalière')}${kp('m_mer','MER / ROAS','CA / pub')}${kp('m_cpa','CPA','pub / commande')}${kp('m_cpc','CPC','pub / clic')}
      ${kp('m_cpm','CPM','pub / 1000 impr.')}${kp('m_ctr','CTR','clics / impr.')}${kp('m_convc','Taux conv. clic→achat','commandes / clics')}${kp('m_part','Part pub du CA','ad ratio')}
    </div>
  </div>`;
}
function recomputeAcq(){
  const A=monthAgg(STATE.month); const a=STATE.ads[STATE.month]||{};
  const imp=num(a.imp), clics=num(a.clics), ads=A.ads, cmd=A.cmd, ca=A.ca;
  const S=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  S('m_dep',eur2(ads)); S('m_mer',ads?(ca/ads).toFixed(2).replace('.',',')+'x':'—');
  S('m_cpa',cmd?eur2(ads/cmd):'—'); S('m_cpc',clics?eur2(ads/clics):'—');
  S('m_cpm',imp?eur2(ads/imp*1000):'—'); S('m_ctr',imp?pctv(clics/imp):'—');
  S('m_convc',clics?pctv(cmd/clics):'—'); S('m_part',ca?pctv(ads/ca):'—');
}
function bindAcq(){ ['imp','clics'].forEach(k=>{const el=document.getElementById('acq_'+k);if(el)el.addEventListener('input',()=>{ if(!STATE.ads[STATE.month])STATE.ads[STATE.month]={}; const v=el.value; if(v==='')delete STATE.ads[STATE.month][k]; else STATE.ads[STATE.month][k]=parseFloat(v); save('vfx3_ads',STATE.ads); recomputeAcq(); });}); recomputeAcq(); }

// ---------- CLOUD (sauvegarde & synchro) ----------
function cloudView(){
  const url=getSyncUrl(), key=getSyncKey(), auto=autoSync();
  const btn=(id,txt,primary)=>`<button id="${id}" style="padding:9px 16px;border-radius:10px;border:${primary?'none':'1px solid rgba(167,139,250,0.25)'};background:${primary?'linear-gradient(145deg,'+accent+','+accent2+')':'transparent'};color:${primary?'#0a0710':'var(--txt2)'};font-weight:${primary?700:600};font-size:13px;cursor:pointer;">${txt}</button>`;
  const lab=t=>`<label style="font-size:12px;font-weight:600;color:var(--muted);">${t}</label>`;
  return `<div class="vf-view"><div class="vf-card" style="max-width:740px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">Sauvegarde & synchro cloud</div>
    <div style="font-size:12.5px;color:var(--muted2);margin-bottom:16px;">Sans ça, tes données ne vivent que dans ce navigateur. Ici tu les sauvegardes dans <b>ton Google Sheet</b> (gratuit, multi-appareils) et/ou dans un <b>fichier</b>.</div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;flex-direction:column;gap:5px;">${lab('URL du script Google (Web App)')}<input class="vf-inp" id="cloud_url" placeholder="https://script.google.com/macros/s/.../exec" value="${url}" style="font-size:12px;"></div>
      <div style="display:flex;flex-direction:column;gap:5px;">${lab('Clé de synchro (optionnelle mais conseillée)')}<input class="vf-inp" id="cloud_key" placeholder="ton code secret" value="${key}"></div>
      <label style="display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt2);cursor:pointer;user-select:none;"><input type="checkbox" id="cloud_auto" ${auto?'checked':''} style="width:16px;height:16px;accent-color:#7c3aed;"> Synchro automatique (sauvegarde 2 s après chaque modif)</label>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
      ${btn('cloud_save','☁ Sauvegarder maintenant',true)}
      ${btn('cloud_load','⬇ Charger depuis le cloud')}
      ${btn('cloud_export','📄 Exporter (fichier)')}
      ${btn('cloud_import','📂 Importer (fichier)')}
      <input type="file" id="cloud_file" accept="application/json,.json" style="display:none;">
    </div>
    <div id="cloud_msg" style="margin-top:14px;font-size:12.5px;color:var(--muted2);min-height:16px;"></div>
    <div id="cloud_status" style="margin-top:2px;font-size:11.5px;color:var(--dim);"></div>
    <div style="margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.2);font-size:12px;color:var(--txt2);line-height:1.7;">
      <b>Mise en place (~10 min, gratuit) — guide fourni <span class="vf-mono">GUIDE-Google-Sheets.md</span> :</b><br>
      1. Crée un Google Sheet vierge. 2. Menu <b>Extensions → Apps Script</b>. 3. Colle le code <span class="vf-mono">Code.gs</span> fourni. 4. <b>Déployer → Nouveau déploiement → Application Web</b> (exécuter en tant que « moi », accès « tout le monde »). 5. Copie l'URL <span class="vf-mono">…/exec</span> et colle-la ci-dessus. 6. Clique « Sauvegarder maintenant ».
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--dim);">💡 Sur un nouvel appareil : mets la même URL + clé, puis « Charger depuis le cloud ». Le fichier d'export reste un filet de sécurité si tu ne veux aucun compte.</div>
  </div></div>`;
}
function bindCloud(){
  const b=id=>document.getElementById(id);
  const persist=()=>{ save('vfx3_syncurl',(b('cloud_url').value||'').trim()); save('vfx3_synckey',(b('cloud_key').value||'').trim()); save('vfx3_autosync',!!b('cloud_auto').checked); };
  ['cloud_url','cloud_key'].forEach(id=>{const el=b(id);if(el)el.addEventListener('change',persist);});
  if(b('cloud_auto'))b('cloud_auto').addEventListener('change',persist);
  if(b('cloud_save'))b('cloud_save').onclick=()=>{ persist(); cloudMsg('Sauvegarde en cours…','var(--muted2)'); syncPush(false).catch(()=>{}); };
  if(b('cloud_load'))b('cloud_load').onclick=()=>{ persist(); if(confirm('Charger les données du cloud et remplacer celles de cet appareil ?')) syncPull(); };
  if(b('cloud_export'))b('cloud_export').onclick=exportJSON;
  if(b('cloud_import'))b('cloud_import').onclick=()=>b('cloud_file').click();
  if(b('cloud_file'))b('cloud_file').onchange=e=>{ if(e.target.files&&e.target.files[0])importJSON(e.target.files[0]); };
  updateSyncStatus();
}

// ---------- router ----------
function renderView(){
  const c=document.getElementById('content'); let html='';
  switch(STATE.nav){
    case 'dashboard': html=dashboardView(); break;
    case 'journal': html=journalView(); break;
    case 'resultat': html=resultatView(); break;
    case 'annuel': html=annuelView(); break;
    case 'calculateur': html=calculateurView(); break;
    case 'acquisition': html=acquisitionView(); break;
    case 'produits': html=productsView(); break;
    case 'recap': html=recapView(); break;
    case 'fixes': html=fixesView(); break;
    case 'synthese': html=syntheseView(); break;
    case 'params': html=paramsView(); break;
    case 'cloud': html=cloudView(); break;
    case 'connexion': html=connexionView(); break;
  }
  c.innerHTML=html;
  c.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.nav);});
  if(STATE.nav==='dashboard') drawDash();
  if(STATE.nav==='journal'){ bindJournal(); recomputeJournal(); }
  if(STATE.nav==='annuel'){ drawAnn(); bindAnnuel(); }
  if(STATE.nav==='calculateur') bindCalc();
  if(STATE.nav==='acquisition') bindAcq();
  if(STATE.nav==='produits'){ if(!STATE.productsData) fetchProducts(); else drawProducts(); }
  if(STATE.nav==='cloud') bindCloud();
  if(STATE.nav==='recap') drawRecap();
  if(STATE.nav==='fixes') bindFixes();
  if(STATE.nav==='synthese') drawSyn();
  if(STATE.nav==='params') bindParams();
  if(STATE.nav==='connexion') bindConnexion();
}

// month nav + import
document.getElementById('mPrev').onclick=()=>{ const [y,m]=STATE.month.split('-').map(Number); const d=new Date(y,m-2,1); STATE.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); save('vfx3_month',STATE.month); renderChrome(); renderView(); };
document.getElementById('mNext').onclick=()=>{ const [y,m]=STATE.month.split('-').map(Number); const d=new Date(y,m,1); STATE.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); save('vfx3_month',STATE.month); renderChrome(); renderView(); };
document.getElementById('importBtn').onclick=importShopify;

applyTheme(); renderChrome(); renderView();
</script>
</body>
</html>
